<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meeting Manager Pro</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/static/assets/css/app.css?v=4.2.0">
</head>
<body>

<div id="login" class="login">
  <form class="loginbox" onsubmit="login();return false">
    <h1>Meeting Manager Pro</h1>
    <p class="muted">سامانه مدیریت جلسات، اقدامات و پروژه‌ها</p>
    <div class="field"><label for="lu">نام کاربری</label><input id="lu" value="admin" autocomplete="username"></div>
    <div class="field"><label for="lp">رمز عبور</label><input id="lp" type="password" value="Admin@123" autocomplete="current-password"></div>
    <button class="btn" type="submit" style="width:100%;margin-top:10px">ورود به سامانه</button>
    <p class="muted" style="font-size:13px">ورود اولیه مدیر: admin / Admin@123</p>
  </form>
</div>

<div id="app" class="shell hide">
  <aside class="side">
    <div class="brand">Meeting Manager Pro<small>مدیریت جلسات و پروژه‌ها<span id="appVersion"></span></small></div>

    <nav class="nav" aria-label="منوی اصلی">
      <button data-sec="dashboard" onclick="section('dashboard')"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="8" rx="1.8"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.8"/><rect x="13.5" y="11.5" width="7" height="9" rx="1.8"/><rect x="3.5" y="14.5" width="7" height="6" rx="1.8"/></svg></span><span>صفحه اصلی</span></button>
      <button data-sec="meetings" onclick="section('meetings')"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="8" r="3.5"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 4.2a3.5 3.5 0 0 1 0 6.6"/></svg></span><span>جلسات</span></button>
      <button data-sec="actions" onclick="section('actions')"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg></span><span>اقدامات</span></button>
      <button data-sec="projects" onclick="section('projects')"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H9l2 2.5h7.5A2.5 2.5 0 0 1 21 10v7.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/></svg></span><span>پروژه‌ها</span></button>
      <button data-sec="calendar" onclick="section('calendar')"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg></span><span>تقویم</span></button>
      <button data-sec="people" onclick="section('people')"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c.6-3.6 3.6-5.5 7.5-5.5s6.9 1.9 7.5 5.5"/></svg></span><span>افراد و تیم‌ها</span></button>
      <button data-sec="notes" onclick="section('notes')"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span><span>یادداشت‌های من</span></button>
      <button data-sec="assistant" onclick="section('assistant')"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 4v-4h0A2.5 2.5 0 0 1 4 13.5z"/></svg></span><span>دستیار هوشمند</span></button>
      <button data-sec="reports" onclick="section('reports')"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5v11M7.5 10.5l4.5 4.5 4.5-4.5M4.5 20.5h15"/></svg></span><span>خروجی و پشتیبان‌گیری</span></button>
      <button id="accessNav" data-sec="access" onclick="section('access')"><span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7.5 3v5.5c0 4.7-3.1 8.2-7.5 9.5-4.4-1.3-7.5-4.8-7.5-9.5V6z"/><path d="M9 12l2.2 2.2L15.5 10"/></svg></span><span>دسترسی‌ها و مجوزها</span></button>
    </nav>

    <div id="miniCal" class="minical" aria-label="تقویم شمسی"></div>

    <div class="userbox">
      <div class="profile-avatar" id="profileAvatar">م</div>
      <div class="user-info"><b id="userName"></b><div class="profile-meta" id="userRole"></div></div>
      <div class="user-actions">
        <button type="button" title="حساب من" aria-label="حساب من" onclick="openProfile()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c.6-3.6 3.6-5.5 7.5-5.5s6.9 1.9 7.5 5.5"/></svg></button>
        <button type="button" title="ظاهر برنامه (رنگ و پس‌زمینه)" aria-label="ظاهر برنامه" onclick="openLook()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.8-.4-1.2-.3-.4-.4-.7-.4-1.1 0-.9.7-1.6 1.6-1.6H17a4 4 0 0 0 4-4C21 6.6 17 3 12 3z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/></svg></button>
        <button type="button" title="حالت روشن / تیره" aria-label="تغییر حالت نمایش" onclick="toggleTheme()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg></button>
        <button type="button" title="خروج از حساب" aria-label="خروج از حساب" onclick="logout()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5.5A2.5 2.5 0 0 1 3 18.5v-13A2.5 2.5 0 0 1 5.5 3H9M16 17l5-5-5-5M21 12H9"/></svg></button>
      </div>
    </div>
  </aside>

  <main class="main">
    <div id="versionBanner" class="banner hide" role="alert"></div>
    <div class="top">
      <div><h1 id="title">صفحه اصلی</h1><p>نمای یکپارچه وضعیت جلسات، اقدامات و پروژه‌ها</p></div>
      <div id="quick" class="toolbar"></div>
    </div>
    <section id="dashboard"></section>
    <section id="meetings" class="hide"></section>
    <section id="actions" class="hide"></section>
    <section id="projects" class="hide"></section>
    <section id="calendar" class="hide"></section>
    <section id="people" class="hide"></section>
    <section id="reports" class="hide"></section>
    <section id="assistant" class="hide"></section>
    <section id="notes" class="hide"></section>
    <section id="access" class="hide"></section>
  </main>
</div>

<div id="modal" class="modal hide" role="dialog" aria-modal="true"><div id="modalbox" class="modalbox"></div></div>
<div id="dialog" class="modal dialog hide" role="dialog" aria-modal="true"><div id="dialogbox" class="modalbox"></div></div>
<div id="toast" class="toast hide" role="status" aria-live="polite"></div>

<script src="/static/assets/js/jalali.js?v=4.2.0"></script>
<script src="/static/assets/js/ui.js?v=4.2.0"></script>
<script src="/static/assets/js/datepicker.js?v=4.2.0"></script>
<script src="/static/assets/js/timepicker.js?v=4.2.0"></script>
<script src="/static/assets/js/charts.js?v=4.2.0"></script>
<script src="/static/assets/js/calendar.js?v=4.2.0"></script>
<script src="/static/assets/js/app.js?v=4.2.0"></script>
</body>
</html>
