name: Windows build
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/MeetingManager.Web -c Release -r win-x64 --self-contained true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: MeetingManager-win-x64
          path: publish
